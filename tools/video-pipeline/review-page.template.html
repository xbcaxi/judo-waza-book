<title>Waza Clip Review</title>
<meta name="description" content="Approve or reject YouTube candidates for judo sequences and grips.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #eef1ec;
  --surface: #fbfcfa;
  --ink: #18201c;
  --muted: #5b675f;
  --line: #d5dcd4;
  --accent: #2c6a4d;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe2;
  --reject: #a8412f;
  --reject-soft: #f4e0db;
  --warn: #8a5a0c;
  --warn-soft: #f5e8cf;
  --chip: #e3e8e1;
  --shadow: 0 1px 2px rgba(24, 32, 28, .06);
  --sans: "IBM Plex Sans", "Hiragino Sans", system-ui, -apple-system, sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --jp: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101412;
    --surface: #181e1b;
    --ink: #e3e9e4;
    --muted: #97a39b;
    --line: #2b342f;
    --accent: #6cb58f;
    --accent-ink: #0d1a13;
    --accent-soft: #1f3529;
    --reject: #e38a78;
    --reject-soft: #3a2420;
    --warn: #e0b060;
    --warn-soft: #362b17;
    --chip: #232b27;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --ground: #101412;
  --surface: #181e1b;
  --ink: #e3e9e4;
  --muted: #97a39b;
  --line: #2b342f;
  --accent: #6cb58f;
  --accent-ink: #0d1a13;
  --accent-soft: #1f3529;
  --reject: #e38a78;
  --reject-soft: #3a2420;
  --warn: #e0b060;
  --warn-soft: #362b17;
  --chip: #232b27;
  --shadow: none;
}
* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 15px/1.45 var(--sans);
  padding-inline: 16px;
  padding-block: 0 48px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--ground);
  margin-inline: -16px; padding-inline: 16px; padding-block: 12px 10px;
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: grid; gap: 10px; }
.titlerow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 600 20px/1.1 var(--cond); margin: 0; letter-spacing: .01em; }
.progress { font: 500 13px/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 11px; font-size: 13px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.chip .n { font-family: var(--mono); font-size: 12px; opacity: .7; margin-left: 4px; }
.sync { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 5px; vertical-align: 0; }
.sync.ok .dot { background: var(--accent); }
.sync.bad .dot { background: var(--reject); }
.who { display: inline-flex; align-items: center; gap: 6px; }
.who input {
  width: 9.5em; border: 1px solid var(--line); background: var(--surface);
  border-radius: 6px; padding: 3px 7px; font-size: 13px;
}

main { display: grid; gap: 14px; margin-top: 14px; }
.edge { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.edge-head { padding: 12px 14px 10px; display: grid; gap: 4px; }
.pair { font: 600 19px/1.2 var(--cond); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; text-wrap: balance; }
.pair .kind { font: 500 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.ja { font: 400 13px/1.3 var(--jp); color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 4px; background: var(--chip); color: var(--muted); letter-spacing: .02em; }
.tag.draft { background: var(--warn-soft); color: var(--warn); }
.tag.done { background: var(--accent-soft); color: var(--accent); }

.cand { border-top: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 8px; }
.cand.approved { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
.cand.rejected .ctitle, .cand.rejected .cmeta { opacity: .55; }
.ctitle { font-weight: 500; overflow-wrap: anywhere; }
.cmeta { font: 400 12px/1.4 var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; font-variant-numeric: tabular-nums; }
.cmeta .strong { color: var(--accent); font-weight: 500; }
.cmeta .long { color: var(--warn); }
.cmeta .weak { color: var(--reject); }
.ai { font-size: 12px; line-height: 1.4; color: var(--muted); }
.ai b { font-weight: 600; }
.ai.yes b { color: var(--accent); }
.ai.no b { color: var(--reject); }
.cand.ai-no .ctitle { opacity: .7; }
.flag { font-size: 12px; color: var(--warn); background: var(--warn-soft); padding: 6px 8px; border-radius: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.flag.moved { color: var(--muted); background: var(--chip); }
.flag-btn {
  border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px;
  min-height: 34px; padding: 0 10px; font-size: 13px; font-weight: 500;
}
.note { display: grid; gap: 4px; }
.note-label { font-size: 12px; color: var(--muted); }
.note textarea {
  width: 100%; max-width: 100%; border: 1px solid var(--accent); border-radius: 8px; background: var(--surface);
  padding: 8px 10px; font-size: 16px; line-height: 1.4; resize: vertical;
}
.note-add { justify-self: start; border: 0; background: none; padding: 4px 0; font-size: 13px; color: var(--accent); }
.note-text {
  justify-self: stretch; text-align: left; border: 0; border-left: 3px solid var(--accent); background: var(--accent-soft);
  border-radius: 0 6px 6px 0; padding: 6px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.player { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.player-note { font-size: 12px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  min-height: 40px; padding: 0 12px; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink);
}
.btn.approve[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.reject[aria-pressed="true"] { background: var(--reject); border-color: var(--reject); color: var(--surface); }
.decide { display: flex; gap: 8px; margin-left: auto; }
.start { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.start input {
  width: 4.6em; min-height: 40px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); padding: 0 8px; font-family: var(--mono); font-size: 16px; text-align: center;
}
.saved { font-size: 11px; color: var(--muted); min-height: 1em; }
.saved.bad { color: var(--reject); }
.more { justify-self: center; margin-top: 4px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.banner { margin-top: 12px; font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }
@media (max-width: 440px) {
  .decide { margin-left: 0; width: 100%; }
  .decide .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="bar">
  <div class="wrap">
    <div class="titlerow">
      <h1>Waza Clip Review</h1>
      <span class="progress" id="progress">0 / 0 edges</span>
    </div>
    <div class="meter" aria-hidden="true"><i id="meter"></i></div>
    <div class="chips" id="views" role="group" aria-label="Show"></div>
    <div class="chips" id="types" role="group" aria-label="Edge type"></div>
    <div class="sync" id="sync">
      <span id="syncText"><span class="dot"></span>Connecting</span>
      <label class="who" for="reviewer">Reviewer role <input id="reviewer" value="project owner" autocomplete="off"></label>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <main id="list"></main>
</div>

<script type="application/json" id="data">__DATA__</script>
<script>
(function () {
  "use strict";
  var EDGES = JSON.parse(document.getElementById("data").textContent);
  var PAGE = 25;
  var TYPES = ["counter", "combination", "grip-throw", "transition", "chain"];
  var TYPE_LABEL = { counter: "counter", combination: "combination", "grip-throw": "grip", transition: "transition", chain: "chain" };

  // touched: edges decided since the view last changed stay on screen, so a mis-tap can be undone
  var state = { view: "todo", type: "all", shown: PAGE, open: {}, touched: {}, noteOpen: {} };
  var decisions = {};   // id -> {status, start_s, reviewer, at}  (from the database)
  var pending = {};     // id -> decision not yet confirmed by the database
  var db = null;

  function store(key, val) {
    try {
      if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null");
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) { return null; }
  }
  pending = store("wcr.pending") || {};
  var savedRole = store("wcr.reviewer");
  var roleInput = document.getElementById("reviewer");
  if (savedRole) roleInput.value = savedRole;
  roleInput.addEventListener("change", function () { store("wcr.reviewer", roleInput.value.trim()); });

  function cid(edge, c) { return edge.slug + "__" + c.v; }
  function current(edge, c) {
    var id = cid(edge, c);
    var d = pending[id] || decisions[id];
    if (d) return { status: d.status, start: d.start_s || 0, note: d.note || "", better: d.better_for || "" };
    return { status: c.status, start: c.st || 0, note: "", better: "" };
  }
  function edgeNote(edge) {
    var d = pending[edge.slug + "__edge"] || decisions[edge.slug + "__edge"];
    return d ? d.note || "" : "";
  }
  function hasNotes(edge) {
    return !!edgeNote(edge) || edge.c.some(function (c) { return !!current(edge, c).note; });
  }
  function edgeState(edge) {
    var any = false, approved = false, undecided = 0;
    edge.c.forEach(function (c) {
      var s = current(edge, c).status;
      if (s === "approved") approved = true;
      if (s === "approved" || s === "rejected") any = true; else undecided++;
    });
    if (approved) return "approved";
    if (undecided === 0) return "rejected";
    return any ? "partly" : "todo";
  }
  // Claude's verdict for an undecided candidate, best first: yes, maybe or unlabelled, no.
  var RANK = { yes: 0, maybe: 1, no: 2 };
  function open_(edge) { return edge.c.filter(function (c) { var s = current(edge, c).status; return s !== "approved" && s !== "rejected"; }); }
  function bestRank(edge) {
    var o = open_(edge);
    if (!o.length) return 3;
    return Math.min.apply(null, o.map(function (c) { return c.ai in RANK ? RANK[c.ai] : 1; }));
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function parseTime(txt) {
    txt = (txt || "").trim();
    if (!txt) return 0;
    var parts = txt.split(":").map(function (p) { return parseInt(p, 10) || 0; });
    return parts.reduce(function (a, p) { return a * 60 + p; }, 0);
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function title(slug) { return slug.replace(/^grip:/, "").replace(/-/g, " "); }

  function matchesView(edge) {
    if (state.type !== "all" && edge.type !== state.type) return false;
    if (state.touched[edge.slug]) return true;
    var s = edgeState(edge);
    var undecided = s === "todo" || s === "partly";
    if (state.view === "todo") return undecided && bestRank(edge) < 2;
    if (state.view === "likely") return undecided && bestRank(edge) === 0;
    if (state.view === "unlikely") return undecided && bestRank(edge) === 2;
    if (state.view === "strong") return (s === "todo" || s === "partly") && edge.c.some(function (c) { return c.s >= 0.6; });
    if (state.view === "new") return (s === "todo" || s === "partly") && edge.c.some(function (c) { return c.new; });
    if (state.view === "approved") return s === "approved";
    if (state.view === "rejected") return s === "rejected";
    if (state.view === "notes") return hasNotes(edge);
    return true;
  }

  function renderChips() {
    var counts = { todo: 0, likely: 0, strong: 0, new: 0, unlikely: 0, approved: 0, rejected: 0, notes: 0, all: 0 };
    var saveView = state.view, saveTouched = state.touched;
    state.touched = {};
    EDGES.forEach(function (e) {
      if (state.type !== "all" && e.type !== state.type) return;
      ["todo", "likely", "strong", "new", "unlikely", "approved", "rejected", "notes", "all"].forEach(function (v) {
        state.view = v; if (matchesView(e)) counts[v]++;
      });
    });
    state.view = saveView;
    state.touched = saveTouched;
    var views = [["todo", "To review"], ["likely", "Likely"], ["strong", "Strong matches"], ["new", "Found today"], ["unlikely", "Likely not"], ["approved", "Approved"], ["rejected", "All rejected"], ["notes", "With notes"], ["all", "All"]];
    var vbox = document.getElementById("views");
    vbox.textContent = "";
    views.forEach(function (v) {
      var b = el("button", "chip", v[1]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.view === v[0]));
      b.appendChild(el("span", "n", counts[v[0]]));
      b.onclick = function () { state.view = v[0]; state.shown = PAGE; state.touched = {}; render(); window.scrollTo(0, 0); };
      vbox.appendChild(b);
    });
    var tbox = document.getElementById("types");
    tbox.textContent = "";
    ["all"].concat(TYPES).forEach(function (t) {
      var b = el("button", "chip", t === "all" ? "Every type" : TYPE_LABEL[t]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.type === t));
      b.onclick = function () { state.type = t; state.shown = PAGE; state.touched = {}; render(); window.scrollTo(0, 0); };
      tbox.appendChild(b);
    });
    var done = EDGES.filter(function (e) { var s = edgeState(e); return s === "approved" || s === "rejected"; }).length;
    document.getElementById("progress").textContent = done + " / " + EDGES.length + " edges decided";
    document.getElementById("meter").style.width = (EDGES.length ? (100 * done / EDGES.length) : 0) + "%";
  }

  function renderCandidate(edge, c) {
    var id = cid(edge, c);
    var cur = current(edge, c);
    var box = el("div", "cand" + (cur.status === "approved" ? " approved" : cur.status === "rejected" ? " rejected" : "") + (c.ai === "no" ? " ai-no" : ""));
    box.appendChild(el("div", "ctitle", c.t));
    var meta = el("div", "cmeta");
    meta.appendChild(el("span", null, c.ch));
    meta.appendChild(el("span", c.d > 420 ? "long" : null, fmtTime(c.d)));
    meta.appendChild(el("span", c.s >= 0.6 ? "strong" : null, "score " + c.s.toFixed(2)));
    meta.appendChild(el("span", null, c.m === "partial" ? "one name in description" : c.m === "title" ? "both names in title" : c.m === "manual" ? "shortlist" : "search"));
    if (c.views) meta.appendChild(el("span", null, c.views >= 1000 ? Math.round(c.views / 1000) + "k views" : c.views + " views"));
    if (c.h != null) meta.appendChild(el("span", c.h >= 0.4 ? "strong" : c.h < 0 ? "weak" : null, "rules " + (c.h > 0 ? "+" : "") + c.h.toFixed(1)));
    box.appendChild(meta);
    var ai = el("div", "ai" + (c.ai ? " " + c.ai : ""));
    if (c.ai) {
      ai.appendChild(el("b", null, { yes: "Likely", maybe: "Unsure", no: "Likely not" }[c.ai]));
      if (c.air) ai.appendChild(document.createTextNode(": " + c.air));
    }
    if (c.hw && c.hw.length) ai.appendChild(document.createTextNode((c.ai ? ". " : "") + "Rules: " + c.hw.join(", ")));
    if (ai.childNodes.length) box.appendChild(ai);
    if (edge.rev && (c.rev_order || cur.better)) {
      var flag = el("div", "flag");
      var revName = title(edge.dst) + " into " + title(edge.src);
      if (cur.better) {
        flag.className = "flag moved";
        flag.appendChild(el("span", null, "Rejected here and kept for " + revName + (edge.revExists ? "." : ", which has no sequence yet.")));
      } else {
        flag.appendChild(el("span", null, "The title names " + title(edge.dst) + " before " + title(edge.src) + ". Check the clip shows the pair in this order."));
      }
      var mv = el("button", "flag-btn", cur.better ? "Undo" : "Wrong order: keep it for " + revName);
      mv.type = "button";
      mv.onclick = function () {
        if (current(edge, c).better) save(edge, c, { status: "candidate", better_for: "" }, false);
        else save(edge, c, { status: "rejected", better_for: edge.rev }, false);
      };
      flag.appendChild(mv);
      box.appendChild(flag);
    }
    if (c.d > 420) {
      box.appendChild(el("div", "flag", "Long video: set the start time where the sequence begins."));
    }

    if (state.open[id]) {
      var p = el("div", "player");
      var f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(c.v) + "?playsinline=1&rel=0" + (cur.start ? "&start=" + cur.start : "");
      f.title = c.t;
      f.allow = "encrypted-media; picture-in-picture; fullscreen";
      f.setAttribute("allowfullscreen", "");
      p.appendChild(f);
      box.appendChild(p);
      box.appendChild(el("div", "player-note", "If the player stays blank, this viewer blocks embedded video. Use Open in YouTube instead."));
    }

    var actions = el("div", "actions");
    var play = el("button", "btn", state.open[id] ? "Close player" : "Play here");
    play.type = "button";
    play.onclick = function () { state.open[id] = !state.open[id]; render(); };
    actions.appendChild(play);
    var open = el("a", "btn", "Open in YouTube");
    open.href = "https://youtu.be/" + encodeURIComponent(c.v) + (cur.start ? "?t=" + cur.start : "");
    open.target = "_blank";
    open.rel = "noopener";
    actions.appendChild(open);

    var startLabel = el("label", "start", "Start ");
    var startId = "start-" + id.replace(/[^A-Za-z0-9_-]/g, "_");
    startLabel.htmlFor = startId;
    var start = el("input");
    start.id = startId;
    start.inputMode = "numeric";
    start.placeholder = "0:00";
    start.value = cur.start ? fmtTime(cur.start) : "";
    start.onchange = function () { save(edge, c, { start_s: parseTime(start.value) }, true); };
    startLabel.appendChild(start);
    actions.appendChild(startLabel);

    var dec = el("div", "decide");
    [["approved", "approve", "Approve"], ["rejected", "reject", "Reject"]].forEach(function (d) {
      var b = el("button", "btn " + d[1], d[2]);
      b.type = "button";
      b.setAttribute("aria-pressed", String(cur.status === d[0]));
      b.onclick = function () {
        var next = current(edge, c).status === d[0] ? "candidate" : d[0];
        save(edge, c, { status: next, start_s: parseTime(start.value) }, false);
      };
      dec.appendChild(b);
    });
    actions.appendChild(dec);
    box.appendChild(actions);
    box.appendChild(noteBlock(id, cur.note, "Note for Claude on this video", function (text) {
      save(edge, c, { note: text }, true);
    }));

    var saved = el("div", "saved");
    if (pending[id]) { saved.textContent = db ? "Saving" : "Saved on this phone only"; if (!db) saved.className = "saved bad"; }
    else if (decisions[id]) saved.textContent = "Saved";
    else if (c.status !== "candidate") saved.textContent = "Decided before this sheet" + (c.rev ? "" : "; no reviewer recorded");
    box.appendChild(saved);
    return box;
  }

  function renderEdge(edge) {
    var card = el("section", "edge");
    var head = el("div", "edge-head");
    var pair = el("div", "pair");
    pair.appendChild(el("span", null, title(edge.src) + (edge.grip ? " grip" : "")));
    pair.appendChild(el("span", "kind", edge.type === "counter" ? "countered by" : edge.type === "grip-throw" ? "into" : edge.type === "transition" ? "to" : "into"));
    pair.appendChild(el("span", null, title(edge.dst)));
    head.appendChild(pair);
    if (edge.srcJa || edge.dstJa) head.appendChild(el("div", "ja", [edge.srcJa, edge.dstJa].filter(Boolean).join("　→　")));
    var meta = el("div", "meta");
    meta.appendChild(el("span", "tag", TYPE_LABEL[edge.type] || edge.type));
    if (edge.seqStatus === "draft") meta.appendChild(el("span", "tag draft", "draft: approving publishes it"));
    if (edge.seqStatus === "reviewed") meta.appendChild(el("span", "tag done", "reviewed"));
    if (edge.existing) meta.appendChild(el("span", "tag", edge.existing + " video already on record"));
    if (edge.priority) meta.appendChild(el("span", "tag", "priority " + edge.priority));
    head.appendChild(meta);
    head.appendChild(noteBlock(edge.slug + "__edge", edgeNote(edge), "Note for Claude on this pair", function (text) {
      saveEdgeNote(edge, text);
    }));
    card.appendChild(head);
    edge.c.forEach(function (c) { card.appendChild(renderCandidate(edge, c)); });
    return card;
  }

  function render() {
    renderChips();
    var list = document.getElementById("list");
    list.textContent = "";
    var rows = EDGES.filter(matchesView);
    if (state.view !== "unlikely") rows = rows.map(function (e, i) { return [bestRank(e), i, e]; })
      .sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; }).map(function (r) { return r[2]; });
    if (!rows.length) { list.appendChild(el("div", "empty", "Nothing here. Try another view.")); return; }
    rows.slice(0, state.shown).forEach(function (e) { list.appendChild(renderEdge(e)); });
    if (rows.length > state.shown) {
      var more = el("button", "btn more", "Show " + Math.min(PAGE, rows.length - state.shown) + " more of " + (rows.length - state.shown));
      more.type = "button";
      more.onclick = function () { state.shown += PAGE; render(); };
      list.appendChild(more);
    }
  }

  function setSync(kind, text) {
    var s = document.getElementById("sync");
    s.className = "sync " + (kind || "");
    var t = document.getElementById("syncText");
    t.textContent = "";
    t.appendChild(el("span", "dot"));
    t.appendChild(document.createTextNode(text));
  }
  function pendingCount() { return Object.keys(pending).length; }

  function write(id) {
    if (!db) return;
    var d = pending[id];
    db.doc("decisions/" + id).set(d).then(function () {
      if (pending[id] === d) { delete pending[id]; store("wcr.pending", pending); }
      decisions[id] = d;
      refreshSync(); requestRender();
    }, function (err) {
      setSync("bad", pendingCount() + " not saved yet (" + (err && err.code || "error") + "). Retrying when the connection returns.");
    });
  }
  function flush() { Object.keys(pending).forEach(write); }
  function refreshSync() {
    if (!db) { setSync("bad", "Saving on this phone only"); return; }
    var n = pendingCount();
    setSync(n ? "" : "ok", n ? "Saving " + n : "All decisions saved");
  }

  function put(id, doc, quiet) {
    doc.reviewer = roleInput.value.trim() || "project owner";
    doc.at = new Date().toISOString();
    pending[id] = doc;
    store("wcr.pending", pending);
    refreshSync();
    if (!quiet) render();
    write(id);
  }
  function save(edge, c, patch, quiet) {
    var cur = current(edge, c);
    state.touched[edge.slug] = true;
    var doc = { edge: edge.slug, video: c.v, status: cur.status, start_s: cur.start, note: cur.note, better_for: cur.better };
    Object.keys(patch).forEach(function (k) { doc[k] = patch[k]; });
    put(cid(edge, c), doc, quiet);
  }
  function saveEdgeNote(edge, text) {
    state.touched[edge.slug] = true;
    put(edge.slug + "__edge", { edge: edge.slug, video: "", kind: "edge", note: text }, true);
  }

  // A note block shows the saved note, or a button; editing opens a textarea that saves when it loses focus.
  function noteBlock(id, note, label, onSave) {
    var wrap = el("div", "note");
    if (state.noteOpen[id]) {
      var areaId = "note-" + id.replace(/[^A-Za-z0-9_-]/g, "_");
      var lab = el("label", "note-label", label);
      lab.htmlFor = areaId;
      var area = el("textarea");
      area.id = areaId;
      area.rows = 3;
      area.value = note;
      area.placeholder = "Why, or what to look for: wrong direction, starts at 2:10, try searching 'kouchi seoi'";
      area.onblur = function () {
        state.noteOpen[id] = false;
        if (area.value.trim() !== note) onSave(area.value.trim());
        requestRender();
      };
      wrap.appendChild(lab);
      wrap.appendChild(area);
      setTimeout(function () { area.focus(); }, 0);
      return wrap;
    }
    if (note) {
      var shown = el("button", "note-text", note);
      shown.type = "button";
      shown.setAttribute("aria-label", "Edit note: " + note);
      shown.onclick = function () { state.noteOpen[id] = true; render(); };
      wrap.appendChild(shown);
    } else {
      var add = el("button", "note-add", "+ " + label);
      add.type = "button";
      add.onclick = function () { state.noteOpen[id] = true; render(); };
      wrap.appendChild(add);
    }
    return wrap;
  }

  // Never rebuild the list under a field being typed in; catch up when it loses focus.
  var renderWaiting = false;
  function requestRender() {
    var a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") && document.getElementById("list").contains(a)) {
      if (!renderWaiting) {
        renderWaiting = true;
        a.addEventListener("blur", function () { renderWaiting = false; setTimeout(requestRender, 0); }, { once: true });
      }
      return;
    }
    render();
  }

  window.addEventListener("online", flush);
  render();

  var claude = window.claude;
  if (!claude || typeof claude.use !== "function") {
    refreshSync();
    var b = document.getElementById("banner");
    b.hidden = false;
    b.textContent = "Open this page on claude.ai to save decisions where Claude can read them. For now they stay on this phone.";
    return;
  }
  claude.use("db").then(function (handle) {
    if (!handle) {
      refreshSync();
      var b = document.getElementById("banner");
      b.hidden = false;
      b.textContent = "Decisions cannot be saved to the shared store in this view, so they stay on this phone.";
      return;
    }
    db = handle;
    setSync("", "Loading decisions");
    var sub = function () {
      db.collection("decisions").onSnapshot(function (snap) {
        snap.docs.forEach(function (d) { decisions[d.id] = d.data(); });
        snap.docChanges().forEach(function (ch) { if (ch.type === "removed") delete decisions[ch.doc.id]; });
        refreshSync();
        requestRender();
        if (pendingCount()) flush();
      }, function (err) {
        setSync("bad", "Lost the connection to saved decisions");
        if (err && err.code === "unavailable") setTimeout(sub, 3000);
      });
    };
    sub();
  });
})();
</script>
