# YouTube Data API v3 key: set YT_API_KEY in the environment, or in a
# gitignored .env beside this file as YT_API_KEY=... Never here.

# The working database and the CSV and JSON files beside it are gitignored:
# they are a crawl, not content. What reaches the repository goes through
# apply_approved.py into sequences/ and grips/.
db: candidates.sqlite

# Channels to index in full via playlistItems.list (1 unit per 50 videos).
# EVERY ONE IS A CHANNEL ID, resolved and checked against YouTube on
# 2026-09-07. Handles were what this list held, and three of the six were
# wrong in a way nothing would have reported: a handle that does not resolve
# prints one line and the channel is skipped, and a handle that resolves to
# the wrong channel is not detectable at all. An id is stable, so keep them.
#
# `trust` weights a channel's candidates in scoring. Names should match
# video-providers/ where a provider exists, so an approved video lands under
# the right provider: Kodokan and Efficient Judo do, and the rest are indexed
# for their material without a provider of their own.
channels:
  - name: Kodokan
    channel_id: UCtF6tu7GuZYkZzht5MIv8UQ
    trust: 1.0
  - name: Efficient Judo
    channel_id: UC1CsWk5MTssfFt6rb7CXKKA   # @EfficientJudo
    trust: 0.7
  - name: Judo Encyclopedia
    channel_id: UCpl8LiBc8KkNKhaQUvwcQGw   # @JudoEncyclopedia
    trust: 0.6
  - name: Judo Fanatics
    channel_id: UCPu7I6loSKoRu0Bt3pyiMOQ   # @JudoFanatics
    trust: 0.7
  # @ShintaroHigashi is not his handle and resolves to nothing; the channel is
  # @shigashi84, which is also what video-channels/shintoro-higashi.json holds
  # as its legacy /user/ URL.
  - name: Shintaro Higashi
    channel_id: UC70qwffU7qQvTVm26wziD8A   # @shigashi84
    trust: 0.7
  # Two channels answer to this name. @FightingFilms is "fightingfilms";
  # @fighting_films is the one video-channels/fighting-films.json registers,
  # so an approved video from it matches a channel the site already lists.
  - name: Fighting Films
    channel_id: UCRy4vIVSC-S75fKSLegr7nA   # @fighting_films
    trust: 0.6

# NOT HERE, AND DELIBERATELY: "IJF Academy" was listed as @IJFAcademy, which
# is a football academy in Dubai. The IJF Academy has no judo channel of its
# own; the federation's judo material is on @judo, "International Judo
# Federation" (UCeYa3QaP2n7I8SpGSqD-kUQ), which
# video-channels/international-judo-federation.json already registers. Add it
# here if its uploads are worth indexing technique by technique; it was left
# out rather than swapped in silently, because indexing a federation's whole
# feed of contest footage is a different decision from indexing a teaching
# channel.

# search.list costs 100 units and the default quota is 10,000 a day.
search_daily_budget: 90

# Scoring. Videos over the limit lose a fifth of a point: a sequence is a few
# seconds of footage and a long video needs a start time set on review.
max_duration_seconds: 420
min_score: 0.5
